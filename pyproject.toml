[project]
authors = [{name = "walcark", email = "kevin.walcarius@cnes.fr"}]
dependencies = []
name = "maja-environment-effects"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
maja_environment_effects = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
pytorch = ">=2.13.0,<3"
numpy = ">=2.5.3,<3"
xarray = ">=2026.7.0,<2027"
scipy = ">=1.18.1,<2"
netcdf4 = ">=1.7.4,<2"
